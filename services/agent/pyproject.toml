[project]
name = "cp-agent"
version = "0.1.0"
description = "ContextPath rule-evaluation agent (one task per employee)."
requires-python = ">=3.12"
dependencies = [
    "cp-shared",
    "nats-py>=2.9",
    "redis>=5.2",
]

[tool.uv.sources]
cp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
