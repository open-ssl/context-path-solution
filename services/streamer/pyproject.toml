[project]
name = "cp-streamer"
version = "0.1.0"
description = "ContextPath recording streamer (one task per archive)."
requires-python = ">=3.12"
dependencies = [
    "cp-shared",
    "nats-py>=2.9",
]

[tool.uv.sources]
cp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamer"]
