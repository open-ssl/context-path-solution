[project]
name = "cp-server"
version = "0.1.0"
description = "ContextPath read API gateway."
requires-python = ">=3.12"
dependencies = [
    "cp-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.2",
    "asyncpg>=0.30",
    "fastapi-cache2>=0.2.1",
    "jinja2>=3.1",
]

[tool.uv.sources]
cp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]
