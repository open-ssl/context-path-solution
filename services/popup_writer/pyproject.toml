[project]
name = "cp-popup-writer"
version = "0.1.0"
description = "ContextPath popup ingestion worker (Redis + TimescaleDB dual-write)."
requires-python = ">=3.12"
dependencies = [
    "cp-shared",
    "nats-py>=2.9",
    "redis>=5.2",
    "asyncpg>=0.30",
]

[tool.uv.sources]
cp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/popup_writer"]
