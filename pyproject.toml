[tool.uv.workspace]
members = ["shared", "services/*"]

[tool.uv.sources]
cp-shared = { workspace = true }

[dependency-groups]
dev = [
    "ruff==0.16.4",
    "poethepoet>=0.46",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "pytest-cov>=7.1.0",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
ignore = [
    # line-too-long
    "E501",
    # raise-without-from-inside-except
    "B904",
    # too-many-return-statements
    "PLR0911",
    # too-many-branches
    "PLR0912",
    # magic-value-comparison
    "PLR2004",
    # too-many-statements
    "PLR0915",
    # too-many-arguments
    "PLR0913",
    # too-many-positional-arguments
    "PLR0917",
    # unnecessary-lambda
    "PLW0108",
    # redefined-loop-name
    "PLW2901",
]
select = [
    # flake8-bugbear
    "B",
    # pycodestyle
    "E",
    "W",
    # fastapi
    "FAST",
    # pylint
    "PL",
    # pyflakes
    "F",
    # isort
    "I",
    # flake8-simplify
    "SIM",
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
  "shared/src",
  "services/server/src",
  "services/popup_writer/src",
  "services/streamer/src",
  "services/agent/src"
]
testpaths = [
  "shared/tests",
  "services/server/tests",
  "services/popup_writer/tests",
  "services/streamer/tests",
  "services/agent/tests"
]

[tool.coverage.run]
source = [
  "shared/src/shared",
  "services/server/src/server",
  "services/popup_writer/src/popup_writer",
  "services/streamer/src/streamer",
  "services/agent/src/agent"
]
omit = [
  "*/tests/*",
  "*/__pycache__/*"
]

[tool.poe]
envfile = [".env"]
verbosity = 1

[tool.poe.executor]
type = "virtualenv"
location = ".venv"

[tool.poe.tasks.ruff-lint]
shell = "uv run ruff check --fix shared services"

[tool.poe.tasks.ruff-format]
shell = "uv run ruff format shared services"

[tool.poe.tasks.format]
sequence = [
    { ref = "ruff-lint" },
    { ref = "ruff-format" },
]

[tool.poe.tasks.benchmark]
help = "Measure peak CPU/RAM of the running stack under streaming + /audit load"
shell = "uv run python dev/scripts/benchmark.py"
